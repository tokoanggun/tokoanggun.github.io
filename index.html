            const icon = document.getElementById('toast-icon');
            if(!toast || !icon) return;

            document.getElementById('toast-msg').innerText = message;
            
            if(type === 'error') {
                icon.className = 'ph-fill ph-warning-circle text-red-500 text-2xl';
                toast.classList.replace('border-gray-100', 'border-red-200');
            } else {
                icon.className = 'ph-fill ph-check-circle text-primary text-2xl';
                toast.classList.replace('border-red-200', 'border-gray-100');
            }

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 3500);
        };

        const generateFallbackImage = (name) => `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Produk')}&background=F7E4E5&color=526D52&size=600&font-size=0.33`;

        const scrollToSection = (id) => {
            if(window.location.hash !== '#home' && window.location.hash !== '') {
                window.location.hash = '#home';
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if(el) {
                        const navHeight = document.getElementById('navbar').offsetHeight;
                        window.scrollTo({ top: el.offsetTop - navHeight - 20, behavior: 'smooth' });
                    }
                }, 150); // slight delay to ensure DOM is ready
            } else {
                const el = document.getElementById(id);
                if(el) {
                    const navHeight = document.getElementById('navbar').offsetHeight;
                    window.scrollTo({ top: el.offsetTop - navHeight - 20, behavior: 'smooth' });
                }
            }
        };

        const openWhatsApp = (customMsg = null) => {
            const msg = customMsg || APP_STATE.settings.default_wa_message || 'Halo Toko Anggun, saya ingin bertanya mengenai layanan/produk Anda.';
            const num = String(APP_STATE.settings?.whatsapp_number || '6285643454205').replace(/\D/g, '');
            if (!num) {
                showToast('Nomor WhatsApp belum tersedia. Silakan hubungi pemilik toko.', 'error');
                return;
            }
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
        };

        // --- 3. DATA FETCHING (SAFE) ---
        async function fetchSettings() {
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('settings').select('*').limit(1).maybeSingle();
                    if (error) throw error;
                    if (data) APP_STATE.settings = { ...APP_STATE.settings, ...data };
                } catch (error) {
                    console.error('Gagal memuat pengaturan website; menggunakan default yang aman.', error);
                }
            }

            const number = String(APP_STATE.settings?.whatsapp_number || '6285643454205').replace(/\D/g, '');
            const displayNumber = number === '6285643454205' ? '+62 856-4345-4205' : (number ? `+${number}` : 'WhatsApp belum diatur');
            ['footer-wa-icon', 'footer-wa-number'].forEach((id) => {
                const link = document.getElementById(id);
                if (!link) return;
                link.href = number ? `https://wa.me/${number}` : '#';
                if (id === 'footer-wa-number') link.textContent = displayNumber;
                link.setAttribute('aria-label', `Hubungi Toko Anggun melalui WhatsApp ${displayNumber}`);
            });
            return APP_STATE.settings;
        }

                async function fetchProducts(isAdmin = false) {
            if (!supabaseClient) {
                console.warn("Supabase tidak aktif. Pastikan API Key diisi.");
                return [];
            }
            try {
                let query = supabaseClient.from('products').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false });
                if (!isAdmin) query = query.eq('is_active', true);
                
                const { data, error } = await query;
                if (error) throw error;

                if (isAdmin) {
                    APP_STATE.adminProducts = data || [];
                } else {
                    APP_STATE.products = data || [];
                    APP_STATE.categories = new Set(APP_STATE.products.map(p => p.category).filter(Boolean));
                }
                return data || [];
            } catch (error) {
                console.error("Gagal mengambil data produk:", error);
                return [];
            }
        }

        async function checkAuth() {
            if (!supabaseClient) return null;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                APP_STATE.user = session?.user || null;
                return APP_STATE.user;
            } catch (e) { return null; }
        }

        async function hasAdminAccess(user = APP_STATE.user) {
            if (!supabaseClient || !user?.id) return false;
            try {
                const { data, error } = await supabaseClient
                    .from('admin_users')
                    .select('user_id')
                    .eq('user_id', user.id)
                    .maybeSingle();
                if (error) {
                    console.error('Gagal memeriksa izin admin:', error);
                    return false;
                }
                return Boolean(data?.user_id);
            } catch (error) {
                console.error('Gagal memeriksa izin admin:', error);
                return false;
            }
        }

        // Prevent repeated settings requests if the settings table has a missing/empty id.
        let settingsFetchStarted = false;

        // --- 4. ROUTER ---
        async function router() {
            try {
                // 1. Parsing Hash aman
                let fullHash = window.location.hash || '#home';
                let hashParts = fullHash.split('?');
                let baseHash = hashParts[0];
                let queryParams = hashParts.length > 1 ? hashParts[1] : '';

                const appContent = document.getElementById('app-content');
                const navbar = document.getElementById('navbar');
                const footer = document.getElementById('footer');
                
                if(!appContent) return; // Guard clause

                // 2. Toggling Navbar/Footer dengan null-check
                if (baseHash === '#admin') {
                    if (navbar) navbar.style.display = 'none';
                    if (footer) footer.style.display = 'none';
                    document.body.style.backgroundColor = '#F3F4F6';
                } else {
                    if (navbar) navbar.style.display = 'block';
                    if (footer) footer.style.display = 'block';
                    document.body.style.backgroundColor = '#FBF7F1';
                }

                // 3. Render loading immediately. Network requests must never block the UI.
                appContent.innerHTML = '<div class="flex-grow flex justify-center items-center w-full h-[60vh]"><div class="loader" role="status" aria-label="Memuat halaman"></div></div>';
                window.scrollTo(0, 0);
                updateCartCount();

                // Load settings in the background; never await this before rendering the page.
                // A slow Supabase connection must not leave the entire main area blank.
                if (baseHash !== '#admin' && supabaseClient && !settingsFetchStarted) {
                    settingsFetchStarted = true;
                    void fetchSettings();
                }

                // 4. Routing
                if (baseHash === '#home') {
                    await renderHome(appContent);
                } else if (baseHash === '#catalog') {
                    await renderCatalog(appContent);
                } else if (baseHash === '#detail') {
                    // Safe parsing for query string (e.g. ?id=123)
                    const params = new URLSearchParams(queryParams);
                    const id = params.get('id');
                    await renderDetail(appContent, id);
                } else if (baseHash === '#cart') {
                    if (APP_STATE.products.length === 0) await fetchProducts();
                    renderCart(appContent);
                } else if (baseHash === '#checkout') {
                    if (APP_STATE.products.length === 0) await fetchProducts();
                    renderCheckout(appContent);
                } else if (baseHash === '#admin') {
                    const user = await checkAuth();
                    if (!user) {
                        await renderAdminLogin(appContent);
                    } else if (await hasAdminAccess(user)) {
                        await renderAdminDashboard(appContent);
                    } else {
                        try { await supabaseClient?.auth.signOut(); } catch (signOutError) { console.warn('Tidak dapat menutup sesi non-admin.', signOutError); }
                        APP_STATE.user = null;
                        await renderAdminLogin(appContent);
                        const errDiv = document.getElementById('login-error');
                        const errText = document.getElementById('login-error-text');
                        if (errText) errText.textContent = 'Akun ini berhasil masuk, tetapi belum memiliki izin admin. Akun harus didaftarkan di tabel public.admin_users terlebih dahulu.';
                        if (errDiv) errDiv.classList.remove('hidden');
                    }
                } else {
                    window.location.hash = '#home'; // Fallback
                }
            } catch (err) {
                console.error("Router Crash:", err);
                const appContent = document.getElementById('app-content');
                if (appContent) {
                    appContent.innerHTML = `<div class="text-center py-20 text-red-500 font-bold bg-white m-10 rounded-2xl shadow-sm border border-red-100">
                        <i class="ph-fill ph-warning-circle text-4xl mb-2"></i><br>
                        Sistem Navigasi Gagal: ${err.message}<br>Silakan muat ulang halaman.
                    </div>`;
                }
            }
        }

        async function renderHome(container) {

            container.innerHTML = '';
            container.appendChild(template);

            if (window.location.hash.split('?')[0] !== '#home' && window.location.hash !== '') return;

            const grid = document.getElementById('home-featured-grid');
            if(!grid) return;
            
            grid.innerHTML = '';
            const featured = APP_STATE.products.filter(p => p.is_featured).slice(0, 4);

            if (displayProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 bg-gray-50 rounded-2xl border border-gray-100"><p class="text-graytext text-sm">Belum ada produk untuk ditampilkan.</p></div>`;

        // B. CATALOG
        async function renderCatalog(container) {
            const template = document.getElementById('tpl-catalog').content.cloneNode(true);
            container.innerHTML = '';
            container.appendChild(template);

            await fetchProducts();
            if(window.location.hash.split('?')[0] !== '#catalog') return;

            const filterContainer = document.getElementById('category-filters');
            if(filterContainer && APP_STATE.categories.size > 0) {
                APP_STATE.categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-btn bg-white border border-gray-200 text-graytext hover:border-primary hover:text-primary px-5 py-2 rounded-full text-sm font-bold transition-colors shadow-sm';
                    btn.dataset.cat = cat;
                    btn.innerText = cat;
                    btn.onclick = (e) => filterCatalog(e, cat);
                    filterContainer.appendChild(btn);
                });
            }

            document.getElementById('search-input')?.addEventListener('input', debounceSearch);
            document.getElementById('sort-select')?.addEventListener('change', runCatalogLogic);

            if(allBtn) allBtn.onclick = (e) => filterCatalog(e, 'all');

        function createProductCard(product) {
            const div = document.createElement('div');
            div.className = 'bg-white rounded-[1.5rem] overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1.5 border border-gray-100 transition-all duration-300 group flex flex-col h-full cursor-pointer relative';

        let searchTimeout;
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(runCatalogLogic, 300);
        }

        function filterCatalog(event, category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = 'cat-btn bg-white border border-gray-200 text-graytext hover:border-primary hover:text-primary px-5 py-2 rounded-full text-sm font-bold transition-colors shadow-sm';
            });
            event.target.className = 'cat-btn active bg-primary text-white border border-primary px-5 py-2 rounded-full text-sm font-bold transition-colors shadow-sm shadow-primary/20';
            runCatalogLogic();
        }

        function resetCatalogFilters() {
            const searchInput = document.getElementById('search-input');
            if(searchInput) searchInput.value = '';
            const allBtn = document.querySelector('[data-cat="all"]');
            if(allBtn) allBtn.click();
            else runCatalogLogic();
        }

        function runCatalogLogic() {
            const activeCatBtn = document.querySelector('.cat-btn.active');
            const category = activeCatBtn ? activeCatBtn.dataset.cat : 'all';
            
            const searchInput = document.getElementById('search-input');
            const term = searchInput ? searchInput.value.toLowerCase() : '';
            
            const sortSelect = document.getElementById('sort-select');
            const sortMethod = sortSelect ? sortSelect.value : 'newest';

            let filtered = APP_STATE.products.filter(p => {
                const matchCat = category === 'all' || p.category === category;
                const matchSearch = p.name.toLowerCase().includes(term);
                return matchCat && matchSearch;
            });

            if(sortMethod === 'price-asc') filtered.sort((a,b) => a.price - b.price);
            else if(sortMethod === 'price-desc') filtered.sort((a,b) => b.price - a.price);

            renderCatalogGrid(filtered);
        }

        function renderCatalogGrid(productsToRender) {
            const grid = document.getElementById('catalog-grid');
            const emptyState = document.getElementById('catalog-empty');
            if(!grid || !emptyState) return;

            grid.innerHTML = '';
            if (productsToRender.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                productsToRender.forEach(p => grid.appendChild(createProductCard(p)));
            }
        }

        function orderItem(id, goCheckout = false) {
            const addons = [];
            if (document.getElementById('addon-card')?.checked) addons.push({ type: 'card', text: document.getElementById('addon-card-text')?.value?.trim() || '' });
            if (document.getElementById('addon-ribbon')?.checked) addons.push({ type: 'ribbon' });
            addToCart(id, addons, goCheckout);
            if (!goCheckout) window.location.hash = '#cart';
        }

        // --- CART & CHECKOUT ---
        const saveCart = () => {
            try { localStorage.setItem('tokoanggun-cart', JSON.stringify(APP_STATE.cart)); } catch (_) {}
            updateCartCount();
        };
        function updateCartCount() {
            const el = document.getElementById('cart-count');
            if (el) el.textContent = String(APP_STATE.cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0));
        }
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }
        function cartLinePrice(item, product) {
            const addonTotal = (item.addons || []).reduce((sum, addon) => sum + (addon.type === 'card' ? 5000 : addon.type === 'ribbon' ? 10000 : 0), 0);
            return (Number(product?.price || 0) + addonTotal) * Number(item.quantity || 1);
        }
        function addToCart(id, addons = [], goCheckout = false) {
            const product = APP_STATE.products.find(p => p.id === id);
            if (!product) { showToast('Produk belum tersedia. Muat ulang katalog.', 'error'); return; }
            const cleanAddons = Array.isArray(addons) ? addons : [];
            const key = JSON.stringify(cleanAddons.map(a => [a.type, a.text || '']));
            const existing = APP_STATE.cart.find(item => item.id === id && JSON.stringify((item.addons || []).map(a => [a.type, a.text || ''])) === key);
            if (existing) existing.quantity = Math.min(99, Number(existing.quantity || 1) + 1);
            else APP_STATE.cart.push({ id, quantity: 1, addons: cleanAddons });
            saveCart();
            showToast(product.name + ' ditambahkan ke keranjang.');
            if (goCheckout) window.location.hash = '#checkout';
        }
        function changeCartQuantity(index, delta) {
            const item = APP_STATE.cart[index];
            if (!item) return;
            item.quantity = Number(item.quantity || 1) + delta;
            if (item.quantity < 1) APP_STATE.cart.splice(index, 1);
            if (item.quantity > 99) item.quantity = 99;
            saveCart();
            renderCart(document.getElementById('app-content'));
        }
        function removeCartItem(index) {
            APP_STATE.cart.splice(index, 1);
            saveCart();
            renderCart(document.getElementById('app-content'));
        }
        function renderCart(container) {
            const validItems = APP_STATE.cart.map((item, index) => ({ item, index, product: APP_STATE.products.find(p => p.id === item.id) })).filter(row => row.product);

        async function submitCheckout(event) {
            event.preventDefault();
            const button = document.getElementById('checkout-submit');
            const errorBox = document.getElementById('checkout-error');
            const shippingRequired = document.getElementById('checkout-shipping').checked;
            const validItems = APP_STATE.cart.map(item => ({ item, product: APP_STATE.products.find(p => p.id === item.id) })).filter(row => row.product);
            const payload = {
                customer: { name: document.getElementById('checkout-name').value.trim(), phone: document.getElementById('checkout-phone').value.trim(), email: document.getElementById('checkout-email').value.trim() },
                shipping_required: shippingRequired,
                shipping_address: shippingRequired ? document.getElementById('checkout-address').value.trim() : '',
                shipping_method: shippingRequired ? document.getElementById('checkout-shipping-method').value : '',
                notes: document.getElementById('checkout-notes').value.trim(),
                payment_method: 'qris_manual',
                items: validItems.map(({item}) => ({ id: item.id, quantity: item.quantity, addons: item.addons || [] }))
            };
            button.disabled = true; button.textContent = 'Menyimpan pesanan…'; errorBox.classList.add('hidden');
            try {
                const response = await fetch(SUPABASE_URL + '/functions/v1/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (!response.ok || !result.ok) throw new Error(result.error || 'Pesanan gagal disimpan. Coba lagi.');
                APP_STATE.lastOrder = result; APP_STATE.cart = []; saveCart();
                if (result.payment_url) { renderOrderResult(document.getElementById('app-content'), result); setTimeout(() => { window.location.href = result.payment_url; }, 700); return; }
                renderOrderResult(document.getElementById('app-content'), result);
            } catch (error) {
                errorBox.textContent = error.message || 'Terjadi kesalahan saat menyimpan pesanan.'; errorBox.classList.remove('hidden');
                button.disabled = false; button.textContent = 'Buat Pesanan';
            }
        }

        async function renderAdminLogin(container) {
            const template = document.getElementById('tpl-admin-login').content.cloneNode(true);
            container.innerHTML = '';
            container.appendChild(template);

            const form = document.getElementById('login-form');
            const btn = document.getElementById('btn-login');
            const errDiv = document.getElementById('login-error');
            const errTxt = document.getElementById('login-error-text');

            if (!supabaseClient) {
                if (errTxt) errTxt.textContent = 'Koneksi Supabase belum siap. Muat ulang halaman atau periksa konfigurasi API.';
                if (errDiv) errDiv.classList.remove('hidden');
                if (btn) btn.disabled = true;
            }

            form?.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabaseClient) {
                    if (errTxt) errTxt.textContent = 'Koneksi Supabase belum siap. Periksa jaringan atau konfigurasi Supabase.';
                    if (errDiv) errDiv.classList.remove('hidden');
                    return;
                }

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const origText = btn?.innerHTML || 'Masuk ke Dashboard';
                if (btn) { btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-t-white"></div>'; btn.disabled = true; }
                if (errDiv) errDiv.classList.add('hidden');

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    const allowed = await hasAdminAccess(data.user);
                    if (!allowed) {
                        await supabaseClient.auth.signOut();
                        APP_STATE.user = null;
                        throw new Error('Email atau akun ini belum terdaftar sebagai admin. Tambahkan user yang benar ke public.admin_users.');
                    }

                    APP_STATE.user = data.user;
                    showToast('Login admin berhasil!');
                    // Hash sudah #admin; jalankan router langsung agar dashboard muncul tanpa menunggu hashchange.
                    await router();
                } catch (error) {
                    console.error('Login admin gagal:', error);
                    if (errTxt) errTxt.textContent = error.message === 'Invalid login credentials' ? 'Email atau password salah.' : error.message;
                    if (errDiv) errDiv.classList.remove('hidden');
                    if (btn) { btn.innerHTML = origText; btn.disabled = false; }
                }
            });
        }

        async function confirmQrisOrder(orderId) {
            if (!supabaseClient || !APP_STATE.user) {
                showToast('Masuk sebagai admin untuk mengonfirmasi pembayaran.', 'error');
                return;
            }
            if (!confirm('Pastikan dana QRIS benar-benar sudah masuk sebelum menandai pesanan ini lunas. Lanjutkan?')) return;
            try {
                const { data, error } = await supabaseClient.from('orders')
                    .update({ payment_status: 'paid', order_status: 'processing', updated_at: new Date().toISOString() })
                    .eq('id', orderId)
                    .select('id')
                    .maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Pesanan tidak diperbarui. Pastikan akun admin memiliki izin.');
                showToast('Pembayaran ditandai lunas.');
                await viewAdminOrders();
            } catch (error) {
                console.error('Gagal mengonfirmasi QRIS:', error);
                showToast(error.message || 'Gagal mengonfirmasi pembayaran.', 'error');
            }
        }
        window.confirmQrisOrder = confirmQrisOrder;

        function toggleAdminSettings(event) {
            event?.preventDefault();
            const orders = document.getElementById('admin-orders-panel');
            const products = document.getElementById('admin-products-panel');
            if (orders) orders.classList.add('hidden');
            if (products) products.classList.remove('hidden');
            const settings = document.getElementById('settings-body');
            if (!settings) return;
            const opening = settings.classList.contains('hidden');
            settings.classList.toggle('hidden', !opening);
            if (opening) settings.scrollIntoView({ behavior: 'smooth', block: 'start' });
            closeAdminSidebarOnMobile();
        }

        // E. ADMIN DASHBOARD
        async function renderAdminDashboard(container) {
            const template = document.getElementById('tpl-admin-dashboard').content.cloneNode(true);
            container.innerHTML = '';
            container.appendChild(template);

            if(APP_STATE.user) {
                document.getElementById('admin-email-display').innerText = APP_STATE.user.email;
            }

            if(!APP_STATE.settings.id && supabaseClient) await fetchSettings();
            
            if(document.getElementById('set-wa')) {
                document.getElementById('set-wa').value = APP_STATE.settings.whatsapp_number || '';
                document.getElementById('set-wa-msg').value = APP_STATE.settings.default_wa_message || '';
            }

            document.getElementById('settings-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-save-settings');
                const origTxt = btn.innerHTML;
                btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-t-white"></div>';
                
                const payload = {
                    whatsapp_number: document.getElementById('set-wa').value.replace(/[^0-9]/g, ''),
                    default_wa_message: document.getElementById('set-wa-msg').value
                };

                try {
                    const { error } = APP_STATE.settings.id 
                        ? await supabaseClient.from('settings').update(payload).eq('id', APP_STATE.settings.id)
                        : await supabaseClient.from('settings').insert([payload]);
                    
                    if(error) throw error;
                    showToast('Pengaturan disimpan!');
                    await fetchSettings();
                } catch (e) {
                    showToast('Gagal menyimpan', 'error');
                }
                btn.innerHTML = origTxt;
            });

            await refreshAdminTable();

            document.getElementById('admin-search')?.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = APP_STATE.adminProducts.filter(p => p.name.toLowerCase().includes(term) || (p.category && p.category.toLowerCase().includes(term)));
                renderAdminTableData(filtered);
            });
        }

        async function refreshAdminTable() {
            await fetchProducts(true);
            
            if(window.location.hash.split('?')[0] !== '#admin') return;
            
            const total = APP_STATE.adminProducts.length;
            const active = APP_STATE.adminProducts.filter(p => p.is_active).length;
            const cats = new Set(APP_STATE.adminProducts.map(p => p.category).filter(Boolean)).size;
            
            if(document.getElementById('stat-total')) {
                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-active').innerText = active;
                document.getElementById('stat-inactive').innerText = total - active;
                document.getElementById('stat-categories').innerText = cats;
            }

            renderAdminTableData(APP_STATE.adminProducts);
        }

        function renderAdminTableData(data) {
            const tbody = document.getElementById('admin-table-body');
            if(!tbody) return; 

            tbody.innerHTML = '';

            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-16 text-graytext"><i class="ph-fill ph-package text-5xl text-gray-200 mb-3"></i><br><p class="font-bold text-dark">Data Kosong</p>Belum ada produk yang ditambahkan.</td></tr>';
                return;
            }

            data.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/70 transition-colors border-b border-gray-100 group';
                
                const statusBadge = p.is_active 
                    ? '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold shadow-sm">Aktif</span>'
                    : '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-md text-[10px] uppercase tracking-wider font-bold shadow-sm">Mati</span>';
                
                tr.innerHTML = `
                    <td class="py-3 px-6"><img src="${p.image_url || generateFallbackImage(p.name)}" class="w-14 h-14 rounded-xl object-cover border border-gray-200 shadow-sm p-0.5 bg-white"></td>
                    <td class="py-3 px-6 font-bold text-dark">
                        ${p.name}
                        ${p.is_featured ? '<i class="ph-fill ph-star text-accent ml-1 text-sm" title="Unggulan"></i>' : ''}
                    </td>
                    <td class="py-3 px-6 text-sm text-gray-500 font-medium">${p.category || '-'}</td>
                    <td class="py-3 px-6 text-sm font-bold text-primary">${formatRupiah(p.price)}</td>
                    <td class="py-3 px-6">${statusBadge}</td>
                    <td class="py-3 px-6 text-right md:opacity-0 group-hover:opacity-100 transition-opacity">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editProduct('${p.id}')" class="bg-white border border-gray-200 text-primary hover:bg-primary hover:text-white p-2 rounded-lg shadow-sm transition"><i class="ph-bold ph-pencil-simple text-sm"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="bg-white border border-gray-200 text-red-500 hover:bg-red-500 hover:text-white p-2 rounded-lg shadow-sm transition"><i class="ph-bold ph-trash text-sm"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // F. ADMIN MODAL ACTIONS
        function openProductModal() {
            const form = document.getElementById('product-form');
            if(!form) return;
            
            form.reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('img-preview').classList.add('hidden');
            document.getElementById('img-placeholder').classList.remove('hidden');
            document.getElementById('img-overlay').classList.add('hidden');
            document.getElementById('prod-image-url').value = '';
            document.getElementById('modal-title').innerText = 'Tambah Produk Baru';
            
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-modal-content');
            modal.classList.remove('hidden');
            
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('img-preview');
                    if(preview) {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                        document.getElementById('img-placeholder').classList.add('hidden');
                        document.getElementById('img-overlay').classList.remove('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function editProduct(id) {
            const p = APP_STATE.adminProducts.find(x => x.id === id);
            if(!p) return;
            
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name || '';
            document.getElementById('prod-cat').value = p.category || '';
            document.getElementById('prod-price').value = p.price || 0;
            document.getElementById('prod-desc').value = p.description || '';
            document.getElementById('prod-wa').value = p.whatsapp_message || '';
            document.getElementById('prod-active').checked = p.is_active;
            document.getElementById('prod-featured').checked = p.is_featured;
            document.getElementById('prod-sort').value = p.sort_order || 0;
            document.getElementById('prod-image-url').value = p.image_url || '';

            const preview = document.getElementById('img-preview');
            const placeholder = document.getElementById('img-placeholder');
            const overlay = document.getElementById('img-overlay');
            
            if (p.image_url) {
                preview.src = p.image_url;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                overlay.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
                overlay.classList.add('hidden');
            }

            document.getElementById('modal-title').innerText = 'Edit Produk';
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        }

        async function saveProduct() {
            const form = document.getElementById('product-form');
            if(!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const btn = document.getElementById('btn-save-product');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-t-white"></div>';
            btn.disabled = true;

            try {
                const id = document.getElementById('prod-id').value;
                let imageUrl = document.getElementById('prod-image-url').value;
                
                const fileInput = document.getElementById('prod-image');
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random().toString(36).substring(2, 15)}.${fileExt}`;
                    
                    const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, file);
                    if (uploadError) throw uploadError;
                    
                    const { data: { publicUrl } } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
                    imageUrl = publicUrl;
                }

                const payload = {
                    name: document.getElementById('prod-name').value,
                    slug: document.getElementById('prod-name').value.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, ''),
                    category: document.getElementById('prod-cat').value,
                    price: parseFloat(document.getElementById('prod-price').value),
                    description: document.getElementById('prod-desc').value,
                    whatsapp_message: document.getElementById('prod-wa').value,
                    is_active: document.getElementById('prod-active').checked,
                    is_featured: document.getElementById('prod-featured').checked,
                    sort_order: parseInt(document.getElementById('prod-sort').value) || 0,
                    image_url: imageUrl
                };

                let resError;
                if (id) {
                    const { error } = await supabaseClient.from('products').update(payload).eq('id', id);
                    resError = error;
                } else {
                    const { error } = await supabaseClient.from('products').insert([payload]);
                    resError = error;
                }

                if (resError) throw resError;

                showToast(id ? 'Data diperbarui' : 'Data ditambahkan');
                closeProductModal();
                await refreshAdminTable();
            } catch (err) {
                console.error(err);
                showToast('Gagal menyimpan data', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            if(!confirm('Yakin ingin menghapus produk ini? Tindakan ini tidak bisa dibatalkan.')) return;
            try {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) throw error;
                showToast('Produk dihapus');
                await refreshAdminTable();
            } catch (err) {
                showToast('Gagal menghapus', 'error');
            }
        }

        // Force the router to rerender when Admin is clicked while the URL is already #admin.
        function navigateToAdmin(event) {
            if (event) event.preventDefault();
            if (window.location.hash !== '#admin') window.location.hash = '#admin';
            else void router();
        }
        window.navigateToAdmin = navigateToAdmin;

        // Listen to direct hash navigation and Back/Forward.
        window.addEventListener('hashchange', () => { void router(); });
        window.addEventListener('popstate', () => { void router(); });

        // Start reliably whether this script runs before or after DOMContentLoaded.
        const startTokoAnggunApp = () => { void router(); };
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', startTokoAnggunApp, { once: true });
        } else {
            startTokoAnggunApp();
        }
    </script>
</body>
</html>
