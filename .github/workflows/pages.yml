name: Deploy Toko Anggun to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ github.token }}

      - name: Assemble homepage hero image
        run: |
          cat source-image-parts/home-hero-*.b64 | tr -d '\r\n ' | base64 --decode > assets/home-hero.webp
          file assets/home-hero.webp
          test "$(head -c 4 assets/home-hero.webp)" = "RIFF"
          test "$(wc -c < assets/home-hero.webp)" -gt 1000

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
